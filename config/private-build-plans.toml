# Presevka Latin base — stock Iosevka glyph design and width.
# Target Iosevka: v34.8.0.
#
# This file is the Latin half of Presevka, and it is the file to edit if you
# want different letterforms. Presevka supplies its own family metadata and
# nine weights with upright and italic slopes; the 500-unit Latin cell pairs
# with a 1000-unit Hangul cell. Leave the [weights], [slopes] and [widths]
# sections alone unless you also intend to redo the Hangul fitting.
#
# ---------------------------------------------------------------------------
# Customizing the Latin design
# ---------------------------------------------------------------------------
# No character variants are overridden by default: you get stock Iosevka.
#
# To adopt a whole stylistic set, add a variants section. For example,
# ss14 is JetBrains Mono Style and ss18 is Input Mono Style:
#
#     [buildPlans.PresevkaBase500.variants]
#     inherits = "ss14"
#
# To change individual glyphs instead, or on top of an inherited set:
#
#     [buildPlans.PresevkaBase500.variants.design]
#     i = "serifed-asymmetric"
#     zero = "slashed"
#     one = "base"
#
# Every preset and variant name is listed in the Iosevka v34.8.0 custom-build
# documentation:
# https://github.com/be5invis/Iosevka/blob/v34.8.0/doc/custom-build.md
#
# Ready-made variant sets live in config/presets/ and are selected without
# editing this file:
#
#     PRESEVKA_PRESET=adwaita-mono make build
#
# The preset is appended to this plan, so everything below still applies.
# PRESEVKA_PRESET=stock (the default) uses Iosevka's own designs.
#
# After editing, run `make build`. If Pretendard is already prepared in this
# working tree, `./scripts/build_iosevka.sh` then `./scripts/merge.sh` is
# enough. Use `make build-fast` to skip hinting while iterating.

[buildPlans.PresevkaBase500]
family = "Presevka Base 500"
spacing = "normal"
serifs = "sans"
exportGlyphNames = false

# Match Pretendard's nine static weights.
[buildPlans.PresevkaBase500.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.PresevkaBase500.weights.ExtraLight]
shape = 200
menu = 200
css = 200

[buildPlans.PresevkaBase500.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.PresevkaBase500.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.PresevkaBase500.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.PresevkaBase500.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.PresevkaBase500.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.PresevkaBase500.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.PresevkaBase500.weights.Black]
shape = 900
menu = 900
css = 900

# Iosevka supplies both native Upright and Italic Latin designs. The merge step
# deliberately keeps Pretendard Hangul upright in both faces.
[buildPlans.PresevkaBase500.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.PresevkaBase500.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

# Conventional half-em Latin and full-em Hangul grid.
[buildPlans.PresevkaBase500.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.PresevkaBase500.metricOverride]
# The Latin is drawn small inside its cell, and the Hangul is no longer pushed
# to fill its own.
#
# Up to 0.8.2 the fitting worked outward from the Hangul: the syllables were
# enlarged until they nearly filled the 1000-unit cell, and the Latin was
# raised to stand beside them, which took the cap to 792. That settles how a
# syllable looks against a capital, and it is the wrong question. Code is
# mostly lowercase, so what governs a line is how much width a lowercase
# letter gets against its own height -- and at a cap of 792 in a 500 cell that
# came to 0.631, against the 0.680 Iosevka itself draws and the 0.719
# Pretendard gives its own lowercase.
#
# A cap of 694 puts it at 0.720. The x-height follows at 526. Nothing in the
# Latin is redrawn: Iosevka is parametric, so it draws at the smaller cap
# rather than scaling down, and the stem stays 78 where a 12% scale would have
# left 68.
cap = 694
ascender = 694
xHeight = 526

# Iosevka's own line height is 1250, drawn around its taller Latin, and every
# vertical metric here derives from it. With the cap down and the syllables
# smaller, the rest was air: at 1160 the box still clears every syllable, and
# the accented Latin is caught by the Win pads below.
leading = 1160
# Back to Iosevka's default. The 1.05 of 0.8.x was there to open the gaps
# that the taller lowercase had eaten; with the cap down they are not eaten.
sb = 'default_sb * 1.0'

# Widen the Win metrics box so legacy Windows applications stop cutting the
# tops off stacked accents.
#
# GDI clips a glyph to usWinAscent and usWinDescent, and Iosevka derives both
# from its 1250 leading: 965 above the baseline and 285 below. Raising the cap
# to 792 carried every accent up with it, so where stock Iosevka has 191
# mapped characters reaching past 965, this font had 359.
#
# 80 fetches 308 of them back, among them the Czech Ž Š Č Ř, the Vietnamese
# ồ ố ề ế and the Cyrillic Ѯ Ӳ. What stays clipped is 51 uppercase
# double-accent stacks, led by Ǚ at 1247, and covering those would mean 282
# rather than 80: a 45% taller line in GDI against this 10%, to rescue
# characters nobody sets in a terminal. 40 below does the same for the
# combining marks that hang lowest.
#
# Nothing changes outside GDI. USE_TYPO_METRICS is set, so DirectWrite lays
# out from the typo metrics, which these pads do not touch; Windows Terminal,
# VS Code and Visual Studio keep the line height they have now.
winMetricAscenderPad = 80
winMetricDescenderPad = 40
